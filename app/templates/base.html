<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#376a57" />
  <title>{% block title %}Glim — savings and debt planning{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/styles.css?v=20261015align" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ '/app/overview' if app_shell else '/' }}" aria-label="Glim home"><span class="brand-mark">G</span><span>Glim</span></a>
  <div class="top-actions">
    {% if app_shell %}<button type="button" class="text-button" id="logoutBtn">Sign out</button>{% else %}<a class="text-button header-signin" href="/signin">Sign in</a>{% endif %}
  </div>
</header>
{% block main %}{% endblock %}
<script src="/static/preferences.js?v=20261015align"></script>
{% block scripts %}{% endblock %}
</body>
</html>
