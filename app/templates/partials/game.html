<section id="tab-game" class="integrated-subsection" data-optional-module="consistency">
  <div class="module-heading"><h3>Keep a steady rhythm</h3><p class="muted">Small, regular steps add up over time.</p></div>
  <div class="consistency-row">
    <div><span class="data-label">Days active</span><strong id="consistencyCount">0</strong></div>
    <div id="freezeAllowance"><span class="data-label">Days you can miss</span><strong id="freezes">1</strong><span class="muted">remaining this month</span></div>
    <button class="secondary" id="freezeBtn" type="button">Use missed-day allowance</button>
  </div>
  <p id="consistencyNote" class="muted">Progress reflects showing up, not how much money you have.</p>
  <span id="level" hidden aria-hidden="true">1</span><span id="stage" hidden aria-hidden="true">Getting started</span><div id="shop" hidden aria-hidden="true"></div><span id="points" hidden aria-hidden="true">0</span>
</section>
