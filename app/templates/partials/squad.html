<details id="tab-squad" class="nested-details" data-overview-extra="squad">
  <summary>Share progress with friends</summary>
  <div class="disclosure-content">
    <p class="muted">Compare consistency, not money. Balances and income are never shared.</p>
    <div id="squadInfo"></div>
    <form id="createSquadForm" class="form-inline"><label class="fill-label">Group name<input id="squadName" placeholder="e.g. Weekly progress" maxlength="50" required/></label><button class="primary" id="createSquadBtn" type="submit">Create group</button></form>
    <form id="joinSquadForm" class="form-inline"><label class="fill-label">Invite code<input id="squadInviteCode" placeholder="Enter invite code" maxlength="20" autocomplete="off" required/></label><button class="secondary" id="joinSquadBtn" type="submit">Join group</button></form>
    <div id="squadActionNote" class="muted" aria-live="polite"></div>
    <h3>Group progress</h3><div id="leaderboard" class="leaderboard"></div><div class="button-row"><button class="secondary danger hidden" id="leaveSquadBtn" type="button">Leave group</button></div><div id="cheerFeed" class="cheer-feed"></div>
    <details class="nested-details"><summary>Group challenge</summary><form id="squadGoalForm" class="goal-form squad-goal-form"><label>Challenge name<input id="squadGoalTitle" maxlength="80" placeholder="12 days on track" required/></label><label>Target days<input id="squadGoalTarget" type="number" min="1" max="1000" value="12" required/></label><label>Reward<select id="squadGoalReward"><option value="1">Green theme</option><option value="2">Progress badge</option><option value="3">Dark theme</option></select></label><button class="primary" type="submit">Create challenge</button></form><div id="squadGoals" class="squad-goals"></div><div id="squadRewards" class="squad-rewards"></div></details>
  </div>
</details>
