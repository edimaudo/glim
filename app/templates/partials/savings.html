<div class="buffer-progress" role="group" aria-label="Savings buffer progress"><div class="progressbar"><span id="bufferFill" style="width:0%"></span></div><div class="buffer-progress-meta"><strong id="bufferSummary">Your savings buffer starts here.</strong><span id="bufferProgressText" class="muted"></span></div><span id="bufferStatus" class="sr-only">Getting started</span></div>
<form id="stashGoalForm" class="goal-form">
  <label>Goal name<input id="stashGoalName" maxlength="60" placeholder="e.g. Emergency fund" required/></label>
  <label>Target amount (CAD)<input id="stashGoalTarget" type="number" min="1" step="0.01" placeholder="1200" required/></label>
  <label>Monthly target (CAD, optional)<input id="stashGoalMonthly" type="number" min="0" step="0.01" placeholder="100" value="0"/></label>
  <button class="primary" type="submit">Add savings goal</button>
</form>
<div id="stashGoals" class="stash-goals"></div>
