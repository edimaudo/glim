<div id="tab-savings" class="savings-goals-content" data-optional-module="savingsGoals">
  <p class="muted module-description">Set another savings target and track how close you are to reaching it.</p>
  <div class="buffer-progress" role="group" aria-label="Savings buffer progress">
    <div class="progressbar"><span id="bufferFill" style="width:0%"></span></div>
    <div class="buffer-progress-meta"><strong id="savingsBufferSummary">Your savings buffer starts here.</strong><span id="savingsBufferProgress" class="muted"></span></div>
  </div>
  <form id="savingsGoalForm" class="goal-form">
    <label>Goal name<input id="savingsGoalName" maxlength="60" placeholder="e.g. Emergency savings" required/></label>
    <label>Target amount (CAD)<input id="savingsGoalTarget" type="number" min="1" step="0.01" placeholder="1200" required/></label>
    <button class="primary" type="submit">Add goal</button>
  </form>
  <div id="savingsGoals" class="stash-goals"></div>
  <span id="savingsBufferStatus" class="visually-hidden">Getting started</span>
</div>
