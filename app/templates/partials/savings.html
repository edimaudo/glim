<section id="savingsTools" class="feature-widget savings-widget" aria-labelledby="stashHeading">
    
    <section class="card section-card">
      <div class="section-head"><div><h2 id="stashHeading">Build your shield</h2><p class="muted">Track progress toward the buffer that helps keep new costs off your cards.</p></div><span class="badge" id="forestLevel">Getting started</span></div>
      <div class="buffer-progress" role="group" aria-label="Savings buffer progress"><div class="progressbar"><span id="bufferFill" style="width:0%"></span></div><div class="buffer-progress-meta"><strong id="forestSummary">Your savings buffer starts here.</strong><span id="forestProgress" class="muted"></span></div></div>
    </section>
    <section class="card section-card">
      <div class="section-head"><div><h2>Savings goals</h2><p class="muted">Create a stash goal alongside your debt payoff plan.</p></div></div>
      <form id="stashGoalForm" class="goal-form">
        <label>Goal name<input id="stashGoalName" maxlength="60" placeholder="e.g. New laptop" required/></label>
        <label>Target amount (CAD)<input id="stashGoalTarget" type="number" min="1" step="0.01" placeholder="1200" required/></label>
        <label>Monthly target (CAD, optional)<input id="stashGoalMonthly" type="number" min="0" step="0.01" placeholder="100" value="0"/></label>
        <button class="primary" type="submit">Add goal</button>
      </form>
      <div id="stashGoals" class="stash-goals"></div>
    </section>
  </section>
