{% extends "base.html" %}
{% set app_shell = false %}
{% block title %}Sign in to Glim{% endblock %}
{% block main %}
<main class="shell signin-shell">
  <section class="signin-page" aria-labelledby="signinTitle">
    <a class="back-home" href="/">← Back to Glim</a>
    <h1 id="signinTitle">Sign in to your plan</h1>
    <p>Enter your email to continue to Glim.</p>
    <form id="authForm" class="auth-form">
      <label for="authEmail">Email address<input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required /></label>
      <button class="primary" type="submit">Continue</button>
    </form>
    <div id="signinResult" class="signin-result hidden" aria-live="polite"></div>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script src="/storage-config.js"></script>
<script src="/static/storage.js?v=20261014copyfix"></script>
<script src="/static/signin.js?v=20261014copyfix"></script>
{% endblock %}
